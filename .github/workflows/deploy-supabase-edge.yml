# Manual deploy for V3 Edge Functions (v1-documents, v1-hives) with _shared bundling via Supabase CLI.
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

concurrency:
  group: deploy-supabase-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-deployment

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Pin CLI; bump intentionally when validating deploy behavior.
      SUPABASE_CLI_VERSION: "2.121.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Resolve project ref and record run metadata
        id: meta
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing credential::Set GitHub secret SUPABASE_ACCESS_TOKEN (Supabase personal access token)."
            exit 1
          fi

          ref="${{ secrets.SUPABASE_PROJECT_REF }}"
          if [ -z "$ref" ]; then
            echo "::error title=Missing project ref::Set GitHub secret SUPABASE_PROJECT_REF in the supabase-deployment environment (or repository secrets)."
            exit 1
          fi
          if ! echo "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error title=Invalid project ref::Expected 20 lowercase alphanumeric characters."
            exit 1
          fi

          echo "project_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Target project ref: $ref"
          echo "Git commit SHA: $GITHUB_SHA"
          echo "Workflow run id: $GITHUB_RUN_ID"

      - name: Validate required source files
        run: |
          set -euo pipefail
          required=(
            supabase/config.toml
            supabase/functions/v1-documents/index.ts
            supabase/functions/v1-hives/index.ts
            supabase/functions/_shared/http.ts
            supabase/functions/_shared/hive-source-storage.ts
          )
          missing=()
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              missing+=("$path")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing sources::Required file(s) not found: ${missing[*]}"
            exit 1
          fi
          echo "Required Edge Function sources and _shared modules are present."

      - name: Verify Supabase CLI installation
        run: |
          set -euo pipefail
          version_line="$(supabase --version 2>&1)"
          echo "$version_line"
          if ! echo "$version_line" | grep -q "${SUPABASE_CLI_VERSION}"; then
            echo "::error title=CLI version mismatch::Expected Supabase CLI ${SUPABASE_CLI_VERSION}."
            exit 1
          fi

      - name: Verify target project access
        env:
          PROJECT_REF: ${{ steps.meta.outputs.project_ref }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF"

      - name: Deploy v1-documents
        id: deploy_documents
        env:
          PROJECT_REF: ${{ steps.meta.outputs.project_ref }}
        run: |
          set -euo pipefail
          echo "Deploying v1-documents (--use-api bundles relative ../_shared imports)"
          supabase functions deploy v1-documents \
            --project-ref "$PROJECT_REF" \
            --use-api

      - name: Deploy v1-hives
        id: deploy_hives
        env:
          PROJECT_REF: ${{ steps.meta.outputs.project_ref }}
        run: |
          set -euo pipefail
          echo "Deploying v1-hives (--use-api bundles relative ../_shared imports)"
          supabase functions deploy v1-hives \
            --project-ref "$PROJECT_REF" \
            --use-api

      - name: Write deployment summary
        if: always()
        env:
          PROJECT_REF: ${{ steps.meta.outputs.project_ref }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
        run: |
          set -euo pipefail

          status_documents="skipped"
          status_hives="skipped"
          overall="failure"

          if [ "${{ steps.deploy_documents.outcome }}" = "success" ]; then
            status_documents="success"
          elif [ "${{ steps.deploy_documents.outcome }}" = "failure" ]; then
            status_documents="failed"
          fi

          if [ "${{ steps.deploy_documents.outcome }}" = "success" ]; then
            if [ "${{ steps.deploy_hives.outcome }}" = "success" ]; then
              status_hives="success"
              overall="success"
            elif [ "${{ steps.deploy_hives.outcome }}" = "failure" ]; then
              status_hives="failed"
            fi
          fi

          {
            echo "## Supabase Edge Function deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Git commit SHA | \`${GIT_SHA:-unknown}\` |"
            echo "| Workflow run id | \`${RUN_ID:-unknown}\` |"
            echo "| Supabase project ref | \`${PROJECT_REF:-unknown}\` |"
            echo "| CLI version (pinned) | \`${SUPABASE_CLI_VERSION}\` |"
            echo "| JWT verification | Unchanged (\`supabase/config.toml\`; deploy never uses \`--no-verify-jwt\`) |"
            echo ""
            echo "| Function | Status |"
            echo "| --- | --- |"
            echo "| v1-documents | ${status_documents} |"
            echo "| v1-hives | ${status_hives} |"
            echo ""
            echo "**Overall:** ${overall}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$overall" != "success" ]; then
            exit 1
          fi
